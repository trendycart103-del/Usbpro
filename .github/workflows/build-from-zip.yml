name: Build USB Checker FRP from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project (ZIP stays in repo, extracted only on the runner)
        run: |
          set -e
          ZIP="USB-Checker-FRP.zip"
          [ -f "$ZIP" ] || ZIP="$(ls -1 *.zip 2>/dev/null | head -n 1)"
          [ -n "$ZIP" ] || { echo "No .zip file found in repo root"; exit 1; }
          echo "Using $ZIP"
          rm -rf project && mkdir project
          unzip -q "$ZIP" -d project
          # if the zip contains one top-level folder, move its contents up
          if [ ! -f project/settings.gradle.kts ]; then
            ROOT="$(dirname "$(find project -maxdepth 3 -name settings.gradle.kts | head -n 1)")"
            [ -n "$ROOT" ] && [ "$ROOT" != "." ] || { echo "settings.gradle.kts not found in zip"; exit 1; }
            shopt -s dotglob
            mv "$ROOT"/* project/ 2>/dev/null || true
          fi
          ls -la project

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          build-root-directory: project

      - name: Validate project structure
        working-directory: project
        run: bash scripts/validate-structure.sh

      - name: Assemble debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee ../build-assemble.log

      - name: Run unit tests (does not block the APK)
        if: always()
        continue-on-error: true
        working-directory: project
        run: gradle :app:testDebugUnitTest --console=plain 2>&1 | tee ../build-tests.log

      - name: Show compile errors summary
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED" build-assemble.log || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: USB-Checker-FRP-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-*.log
            project/app/build/reports/**
          if-no-files-found: ignore
