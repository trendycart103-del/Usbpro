name: Build USB Checker FRP from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          set -e
          ZIP=$(ls *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then echo "No .zip file found in repository root"; exit 1; fi
          echo "Using $ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          SETTINGS=$(find extracted -maxdepth 3 -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle.kts not found inside the ZIP"; exit 1; fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages (preinstalled SDK on the runner)
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate project structure
        working-directory: ${{ env.PROJECT_DIR }}
        run: bash scripts/validate-structure.sh

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee build-tests.log

      - name: Run static checks (lint)
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:lintDebug --stacktrace 2>&1 | tee build-lint.log

      - name: Assemble debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --stacktrace 2>&1 | tee build-assemble.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: USB-Checker-FRP-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ env.PROJECT_DIR }}/build-*.log
            ${{ env.PROJECT_DIR }}/app/build/reports/**
          if-no-files-found: ignore
