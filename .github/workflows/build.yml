name: Build USB Link Pro

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        shell: bash
        run: |
          shopt -s nullglob
          files=(*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: repository root-এ কোনো .zip ফাইল নেই"
            exit 1
          fi
          mkdir -p work
          unzip -q -o "${files[0]}" -d work
          DIR=$(find work -maxdepth 3 -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$DIR" ]; then
            echo "ERROR: zip-এর ভেতরে settings.gradle.kts পাওয়া যায়নি"
            exit 1
          fi
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project found at: $DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug and release APKs
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/logs"
          gradle --no-daemon --stacktrace \
            :controller:assembleDebug :receiver:assembleDebug \
            :controller:assembleRelease :receiver:assembleRelease \
            2>&1 | tee "$GITHUB_WORKSPACE/logs/build.log"

      - name: Run unit tests
        id: tests
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :core:testDebugUnitTest \
            2>&1 | tee "$GITHUB_WORKSPACE/logs/unit-tests.log"

      - name: Run lint
        id: lint
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle --no-daemon --stacktrace \
            :core:lintDebug :controller:lintDebug :receiver:lintDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/logs/lint.log"

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Build summary"
            echo "- Unit tests: ${{ steps.tests.outcome }}"
            echo "- Lint: ${{ steps.lint.outcome }}"
            echo "- Instrumented/device tests: NOT RUN (এই workflow-এ emulator নেই)"
            echo "- Release APK unsigned; ফোনে ইনস্টলের জন্য debug APK ব্যবহার করুন"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            ${{ env.PROJECT_DIR }}/controller/build/outputs/apk/**/*.apk
            ${{ env.PROJECT_DIR }}/receiver/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-and-reports
          path: |
            logs/
            ${{ env.PROJECT_DIR }}/**/build/reports/
            ${{ env.PROJECT_DIR }}/**/build/test-results/
          if-no-files-found: warn
